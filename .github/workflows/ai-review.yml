name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 首阶段只处理同仓库 PR；Fork PR 另行设计授权流程。
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    outputs:
      report: ${{ steps.codex.outputs.final-message }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for matching diagnostics
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'

      - name: Verify review snapshot helper on Linux
        shell: bash
        run: node --test .agents/skills/code-review/scripts/build-review-manifest.test.mjs

      - name: Probe Node child processes outside Codex
        shell: bash
        run: |
          node --version
          git --version
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'

          let failed = false
          for (const [command, args] of [
            ['/bin/true', []],
            ['git', ['rev-parse', '--show-toplevel']],
          ]) {
            const result = spawnSync(command, args, {
              encoding: 'utf8',
              maxBuffer: 64 * 1024 * 1024,
            })
            console.log(JSON.stringify({
              command,
              status: result.status,
              error: result.error && {
                code: result.error.code,
                syscall: result.error.syscall,
                message: result.error.message,
              },
              stdout: result.stdout,
              stderr: result.stderr,
            }))
            if (result.error || result.status !== 0) failed = true
          }
          if (failed) process.exitCode = 1
          NODE

      - name: Install sandbox prerequisite
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          command -v bwrap
          bwrap --version

      - name: Run project review skill
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: https://gptapi001.huasu.org/v1/responses
          model: gpt-6.1-sol
          effort: low
          prompt-file: .github/codex/prompts/review.md
          output-file: review-report.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
